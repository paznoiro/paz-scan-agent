name: Build and release

# Merges to master verify everything, build the installer, try it on a clean Windows runner and keep
# it as a run artifact. Pushing a tag like v1.2.3 additionally attaches it to a GitHub Release:
#   git tag v1.2.3 && git push origin v1.2.3   # → Release "v1.2.3" + PazScanAgentSetup-1.2.3.exe
# The tag must match <Version> in Directory.Build.props.

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]

# Read-only by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  build-installer:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).SelectSingleNode("//Version").InnerText
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$' -and $Matches[1] -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props. Bump it, commit, and tag that commit."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish the agent
        shell: pwsh
        run: dotnet publish src/PazScan.Agent.Windows -c Release -o artifacts/win-x64 -p:DebugType=none "-p:Version=${{ steps.version.outputs.VERSION }}"

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $sha = "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $sha) { throw "Inno Setup download does not match its known SHA-256 (got $hash)." }
          $log = Join-Path $env:RUNNER_TEMP "innosetup-install.log"
          $p = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CURRENTUSER","/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed (exit $($p.ExitCode)). Log: $log" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6"
          if (-not (Test-Path (Join-Path $dir "ISCC.exe"))) { throw "ISCC.exe not found in $dir" }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Compile the installer
        shell: pwsh
        run: |
          & iscc "/DAppVersion=${{ steps.version.outputs.VERSION }}" installer/PazScanAgent.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem artifacts/PazScanAgentSetup-*.exe

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: PazScanAgentSetup-${{ steps.version.outputs.VERSION }}
          path: artifacts/PazScanAgentSetup-${{ steps.version.outputs.VERSION }}.exe
          if-no-files-found: error

      - name: Try the installer (install, upgrade, uninstall)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup "artifacts/PazScanAgentSetup-${{ steps.version.outputs.VERSION }}.exe" -Version "${{ steps.version.outputs.VERSION }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PazScanAgentSetup-${{ needs.build-installer.outputs.version }}
          path: dist

      # Re-runnable: a release that already exists (say, from a re-run) gets the setup replaced.
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.exe --clobber
          else
            prerelease=()
            [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" dist/*.exe --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
          fi
