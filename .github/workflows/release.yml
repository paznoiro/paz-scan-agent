name: Build and release

# Merges to master verify everything, build the installers for Windows, macOS and Linux, try each on
# a clean runner and keep them as run artifacts. Pushing a tag like v1.2.3 additionally attaches them
# to a GitHub Release:
#   git tag v1.2.3 && git push origin v1.2.3
#   → Release "v1.2.3" with PazScanAgentSetup-1.2.3.exe (Windows),
#     PazScanAgent-1.2.3-macos-arm64.pkg and -x64.pkg (macOS),
#     paz-scan-agent_1.2.3_amd64.deb and _arm64.deb (Debian/Ubuntu),
#     paz-scan-agent-1.2.3-linux-x64.tar.gz and -arm64.tar.gz (other Linux)
# The tag must match <Version> in Directory.Build.props.

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]

# Read-only by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props. Bump it, commit, and tag that commit."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Builds every project, including the macOS/Linux host, not just the test project.
      - run: dotnet build PazScanAgent.slnx -c Release
      - run: dotnet test --no-build -c Release

  windows:
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish the agent
        shell: pwsh
        run: dotnet publish src/PazScan.Agent.Windows -c Release -o artifacts/win-x64 -p:DebugType=none "-p:Version=${env:VERSION}"

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $sha = "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $sha) { throw "Inno Setup download does not match its known SHA-256 (got $hash)." }
          $log = Join-Path $env:RUNNER_TEMP "innosetup-install.log"
          $p = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CURRENTUSER","/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed (exit $($p.ExitCode)). Log: $log" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6"
          if (-not (Test-Path (Join-Path $dir "ISCC.exe"))) { throw "ISCC.exe not found in $dir" }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Compile the installer
        shell: pwsh
        run: |
          & iscc "/DAppVersion=${env:VERSION}" installer/PazScanAgent.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem artifacts/PazScanAgentSetup-*.exe

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: PazScanAgentSetup-${{ env.VERSION }}
          path: artifacts/PazScanAgentSetup-${{ env.VERSION }}.exe
          if-no-files-found: error

      - name: Try the installer (install, upgrade, uninstall)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup "artifacts/PazScanAgentSetup-${env:VERSION}.exe" -Version "${env:VERSION}"

  macos:
    needs: test
    # Apple Silicon. It builds the Intel package too (the SDK cross-compiles and signs it), but can
    # only try the native one.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the installer
        run: ./scripts/build-macos-installer.sh ${{ matrix.arch }}

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: PazScanAgent-${{ env.VERSION }}-macos-${{ matrix.arch }}
          path: artifacts/PazScanAgent-${{ env.VERSION }}-macos-${{ matrix.arch }}.pkg
          if-no-files-found: error

      - name: Try the installer (install, upgrade, uninstall)
        if: matrix.arch == 'arm64'
        run: ./scripts/test-macos-installer.sh "artifacts/PazScanAgent-$VERSION-macos-arm64.pkg" "$VERSION"

  linux:
    needs: test
    # Each architecture on its own runner, so each package is installed and tried natively.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb: amd64
            runner: ubuntu-24.04
          - arch: arm64
            deb: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the installer
        run: ./scripts/build-linux-installer.sh ${{ matrix.arch }}

      # The .deb's version spells a prerelease 1.3.0~beta.1, hence the wildcard.
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: paz-scan-agent-${{ env.VERSION }}-linux-${{ matrix.arch }}
          path: |
            artifacts/paz-scan-agent_*_${{ matrix.deb }}.deb
            artifacts/paz-scan-agent-${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Try the installer (install, upgrade, remove)
        run: sudo ./scripts/test-linux-installer.sh artifacts/paz-scan-agent_*_${{ matrix.deb }}.deb "$VERSION"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every installer this run built, side by side.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Re-runnable: a release that already exists (say, from a re-run) gets its files replaced.
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
          fi
